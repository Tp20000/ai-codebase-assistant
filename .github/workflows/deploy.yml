# ================================================================
# Continuous Deployment Pipeline
# AI Codebase Assistant v2.0
#
# Triggers: push to main branch only
# Jobs:
#   1. build-and-push  — Build + push images to GitHub Container Registry
#   2. deploy-backend  — Deploy to Railway via CLI
#   3. deploy-frontend — Deploy to Vercel via CLI
#   4. smoke-test      — Post-deploy health check
# ================================================================

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-codebase-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-codebase-frontend
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:

  # ── Job 1: Build + Push Images ─────────────────────────────────
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for images
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.BACKEND_IMAGE }}
            ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile.prod
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }},${{ env.BACKEND_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile.prod
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ steps.meta.outputs.version }},${{ env.FRONTEND_IMAGE }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            VITE_API_URL=${{ secrets.VITE_API_URL }}
            VITE_WS_URL=${{ secrets.VITE_WS_URL }}

  # ── Job 2: Deploy Backend to Railway ───────────────────────────
  deploy-backend:
    name: Deploy Backend (Railway)
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ secrets.BACKEND_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up \
            --service backend \
            --environment production \
            --detach
        continue-on-error: true

      - name: Trigger Railway redeploy via API
        if: secrets.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ] && [ -n "$RAILWAY_SERVICE_ID" ]; then
            curl -s -X POST \
              -H "Authorization: Bearer $RAILWAY_TOKEN" \
              -H "Content-Type: application/json" \
              "https://backboard.railway.app/graphql/v2" \
              -d "{\"query\": \"mutation { serviceInstanceRedeploy(serviceId: \\\"$RAILWAY_SERVICE_ID\\\") }\"}"
          fi

  # ── Job 3: Deploy Frontend to Vercel ───────────────────────────
  deploy-frontend:
    name: Deploy Frontend (Vercel)
    runs-on: ubuntu-latest
    needs: build-and-push
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ secrets.FRONTEND_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Build frontend for production
        working-directory: frontend
        run: npm run build:prod
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_WS_URL: ${{ secrets.VITE_WS_URL }}

      - name: Deploy to Vercel
        working-directory: frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            vercel deploy --prod \
              --token "$VERCEL_TOKEN" \
              --yes
          else
            echo "VERCEL_TOKEN not set - skipping Vercel deploy"
            echo "Add VERCEL_TOKEN to GitHub Secrets to enable auto-deploy"
          fi

  # ── Job 4: Post-Deploy Smoke Test ─────────────────────────────
  smoke-test:
    name: Post-Deploy Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    timeout-minutes: 10
    if: always()

    steps:
      - name: Wait for services to be ready
        run: sleep 30

      - name: Backend health check
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -n "$BACKEND_URL" ]; then
            response=$(curl -s -o /dev/null -w "%{http_code}" "$BACKEND_URL/api/v1/health/" --max-time 30)
            if [ "$response" = "200" ]; then
              echo "Backend health check PASSED (HTTP $response)"
            else
              echo "Backend health check returned HTTP $response"
              exit 1
            fi
          else
            echo "BACKEND_URL not set - skipping health check"
          fi

      - name: Frontend availability check
        env:
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
        run: |
          if [ -n "$FRONTEND_URL" ]; then
            response=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL" --max-time 30)
            if [ "$response" = "200" ]; then
              echo "Frontend check PASSED (HTTP $response)"
            else
              echo "Frontend returned HTTP $response"
              exit 1
            fi
          else
            echo "FRONTEND_URL not set - skipping frontend check"
          fi

      - name: Deployment summary
        run: |
          echo "================================================"
          echo "DEPLOYMENT COMPLETE"
          echo "Backend: ${{ secrets.BACKEND_URL }}"
          echo "Frontend: ${{ secrets.FRONTEND_URL }}"
          echo "Image tag: ${{ needs.build-and-push.outputs.image-tag || 'latest' }}"
          echo "================================================"